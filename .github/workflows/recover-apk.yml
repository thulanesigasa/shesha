name: Download existing production APK
on:
  push:
    branches: [main]
    paths: [release-recovery.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: 0c476bbb-2342-4336-bb38-0fa2d6d9f0c8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Fetch finished build without recompiling
        run: |
          eas build:view 955a2e7d-dde4-41d7-b0b9-fa4d8dd26616 --json > build-output.json
          node scripts/download-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: shesha-v1.0.1-production-apk
          path: |
            shesha.apk
            shesha.apk.sha256
          retention-days: 90
      - name: Attempt GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release upload v1.0.1 shesha.apk shesha.apk.sha256 --clobber
            gh release edit v1.0.1 --latest=false
          else
            gh release create v1.0.1 shesha.apk shesha.apk.sha256 --latest=false --target 3b02eb1d1cf7bb79847091f63b1e21103affcb08 --title 'Shesha v1.0.1' --notes 'Archived first production Android APK. Runtime 1.0.1. Version 1.0.2 is the latest native release.'
          fi
