name: Capture exact app screens
on:
  push:
    branches: [main]
    paths: [capture-request.json]
  workflow_dispatch:
    inputs:
      project:
        description: Project repository name, or all
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: real-app-captures
  cancel-in-progress: false
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: select
        env:
          SELECTED: ${{ inputs.project || 'all' }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const targets=JSON.parse(fs.readFileSync('scripts/capture/targets.json'));
          const projects=process.env.SELECTED==='all'?JSON.parse(fs.readFileSync('capture-request.json')).projects:[process.env.SELECTED];
          if(!projects.length||projects.some(p=>!targets[p]))throw Error('Unknown capture project');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'projects='+JSON.stringify(projects)+'\n');
          JS
  capture:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(needs.targets.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - name: Prepare released APK or build actual app source
        env:
          CAPTURE_PROJECT: ${{ matrix.project }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/capture/prepare.mjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture unmodified app UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node scripts/capture/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: real-screen-${{ matrix.project }}
          path: capture-output/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [targets, capture]
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: 0c476bbb-2342-4336-bb38-0fa2d6d9f0c8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: real-screen-*
          path: capture-output
          merge-multiple: true
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Save successful captures with provenance
        run: |
          node scripts/capture/publish.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/captures capture-manifest.json
          git diff --cached --quiet || git commit -m 'Save exact app screen captures for device mockups'
          git push origin HEAD:main
      - run: npm ci && npm ci --prefix server
      - run: npm run typecheck && npm test && node scripts/check-runtime.mjs
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish captures to installed apps
        run: |
          eas update --branch production --environment production --platform android --message 'Exact app UI captures' --non-interactive
          eas update --branch preview --environment preview --platform android --message 'Exact app UI captures' --non-interactive
