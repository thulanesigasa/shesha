name: Publish OTA update
on:
  push:
    branches: [main, preview]
    paths: [App.tsx, CarouselPreview.tsx, Ui.tsx, SettingsGuide.tsx, SettingsScreens.tsx, DashboardDrafts.tsx, Controls.tsx, models.ts, assets/**, index.js, .github/workflows/ota.yml]
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [production, preview]
        default: production
permissions:
  contents: read
concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[native-build]')
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || '0c476bbb-2342-4336-bb38-0fa2d6d9f0c8' }}
      CHANNEL: ${{ inputs.channel || (github.ref_name == 'preview' && 'preview' || 'production') }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm ci --prefix server
      - run: npm run typecheck && npm test
      - name: Guard native compatibility
        run: node scripts/check-runtime.mjs
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish channel
        run: |
          test -n "$EXPO_PROJECT_ID" || { echo 'EXPO_PROJECT_ID is missing'; exit 1; }
          eas channel:view "$CHANNEL" --json --non-interactive || eas channel:create "$CHANNEL" --non-interactive
          eas update --branch "$CHANNEL" --environment "$CHANNEL" --platform android --message "Shesha ${GITHUB_SHA}" --non-interactive
          eas channel:edit "$CHANNEL" --branch "$CHANNEL" --non-interactive
